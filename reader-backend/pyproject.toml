[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mecon-reader-backend"
version = "0.1.0"
description = "MECON Reader API facade over a session-lookup port and a core port"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["starlette==1.10.0", "uvicorn==0.54.0", "cryptography==50.0.2", "httpx==0.28.1"]

[project.scripts]
mecon-reader-backend = "mecon_reader_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-p no:cacheprovider"
