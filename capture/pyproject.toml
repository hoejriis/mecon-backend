[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mecon-capture"
version = "0.1.0"
description = "Receive-only MQTT observation ingester and raw capture archive for MECON"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["paho-mqtt==2.2.0"]

[project.scripts]
mecon-capture = "mecon_capture.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
markers = ["integration: needs a real mosquitto (see tests/test_integration_mosquitto.py)"]
