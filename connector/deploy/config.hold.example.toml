# MECON USB Connector: configuration for the WebSocket hold transport. Every value is a placeholder.
# Use with deploy/systemd/mecon-connector-hold.conf.example. Validate after editing:
#   sudo -u mecon-connector /opt/mecon-connector/bin/mecon-connector --check-config --config /etc/mecon-connector/config.toml
# No broker, no broker password: the only credential is the device-scoped connector token.
transport = "hold"

[device]
mode = "companion"
baud = 115200
select = { by_id = "usb-REPLACE_WITH_YOUR_DEVICE_ID-*" }

[hold]
# The Backend's base URL; the Connector adds /gateway/ws. https (or wss) only: plain http/ws is refused
# unless insecure_allow_plain = true, which is for loopback or a closed test LAN.
base_url = "https://backend.example.invalid"
# systemd places the credential here (LoadCredential= in the drop-in). Create the source file
# /etc/mecon-connector/credentials/hold-token (root, 0600) holding the token and nothing else.
token_file = "/run/credentials/mecon-connector.service/hold-token"
# "header" sends Authorization: Bearer <token> (default). "subprotocol" offers `mecon-bridge` and
# `bearer.<token>` instead, for a path where a proxy strips the header.
token_presentation = "header"
# ca_file = "/etc/mecon-connector/ca.pem"   # only for a Backend behind a private CA
# request_timeout_s = 15                    # how long one relayed request may wait for the device
# ping_interval_s = 20                      # WebSocket control pings; 0 turns them off

# Bootloader serial DFU (optional, off by default). With it the Connector declares serial_dfu on the hold and,
# for an update job the Backend arms on the live socket, fetches the release's DFU package with the token above,
# checks it, and sends it to the device's bootloader when the device resets into it. The bootloader is a
# different USB device from the application: select its own port (path, by_id, or vid and pid, as device.select;
# never the same selector, never a /dev/ttyACM0 node). Find it with --list-ports while the board is in its
# bootloader. Without an armed job the bootloader port is never opened.
# [dfu]
# enabled = true
# bootloader = { by_id = "usb-REPLACE_WITH_YOUR_BOOTLOADER_ID-*" }
# bootloader_wait_s = 30      # how long to look for the bootloader port after the device reset
# app_return_wait_s = 120     # how long to wait for the application port after the transfer
# arm_window_s = 60           # a job keeps the socket across a reset only within this long of `ready`
# attempts = 3                # transfer attempts before the job is reported failed
# package_max_bytes = 2097152
# failed_hold_s = 1800        # how long a failed job keeps the hold without a device link
# stop_wait_s = 5             # at shutdown: how long to wait for a running transfer to finish its frame and close the port
# state_dir = "/var/lib/mecon-connector"  # where the marker of a board that needs a UF2 copy is kept (the unit's StateDirectory)

# The enrolment gate (deployment.get). Requests are relayed only while the device says "provisioned";
# these only tune how often it asks and how a transient answer is treated (see the README).
# [downlink.gate]
# recheck_s = 600             # while open
# retry_s = 30                # while closed, and after a "failed" answer below the threshold
# timeout_s = 8               # an unanswered request counts as closed and releases the hold
# busy_retry_s = 3            # a "busy" answer (no memory) changes nothing and is asked again this soon
# failed_threshold = 3        # this many "failed" answers (storage) in a row close the gate and release the hold
# busy_backoff_after = 3      # after this many "busy" answers in a row, ask again after retry_s instead of busy_retry_s

[health]
enabled = true
bind = "127.0.0.1"
port = 9464
