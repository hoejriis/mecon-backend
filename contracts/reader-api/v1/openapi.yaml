openapi: 3.1.0
info:
  title: MECON Reader API
  version: 1.0.0-draft.3
  summary: Interface between the MECON Reader and an authorized MECON Backend.
  description: |
    Machine-readable form of docs/READER_API_CONTRACT.md. Target specification,
    not a claim that any Backend serves it today.

    * **M1** (session) operations are frozen for the first restricted deployment:
      login, login poll, session, logout, health, devices (may be empty).
    * **M2** (messaging) operations are drafts and may change by pull request
      until the Backend implements them.

    The Reader is served at the same origin as this API (the API is reached
    through the Reader host's reverse proxy). The Backend authenticates with a
    host-only, `Secure`, `HttpOnly` session cookie named `__Host-mecon_session`.
    No bearer tokens, no CORS. State-changing requests carry `X-CSRF-Token`
    (from `GET /session`) and an `Origin` header the Backend allowlists.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/reader/v1
    description: Same origin as the Reader
security:
  - sessionCookie: []
tags:
  - name: session
    description: M1. Login, session, logout and health.
  - name: devices
    description: M1 (may be empty). Assigned Companions.
  - name: messaging
    description: M2 draft. Identities, conversations, contacts, channels, sends.
  - name: events
    description: M2 draft. Server-sent events.

paths:
  /health:
    get:
      tags: [session]
      operationId: getHealth
      summary: Public liveness and deployed commit
      security: []
      responses:
        '200':
          description: Backend is up
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              examples:
                ok: { externalValue: fixtures/health.json }

  /login:
    post:
      tags: [session]
      operationId: startLogin
      summary: Request a magic-link login for an existing account
      description: |
        Sends a one-time link to the address if, and only if, it belongs to an
        existing account. The response is identical either way (no account
        oracle). Opening the link approves the request; it does **not** sign in
        the browser that opened it. The Reader that asked polls
        `GET /login/{request_id}` and receives the session cookie on the
        winning poll. Pre-session, so no CSRF token: protected by the Origin
        allowlist and per-source rate limits.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '202':
          description: Accepted (sent or silently not sent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginStarted' }
              examples:
                started: { externalValue: fixtures/login-started.json }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/Throttled' }

  /login/{request_id}:
    get:
      tags: [session]
      operationId: pollLogin
      summary: Poll a pending login request
      description: |
        `approved` is returned exactly once, with `Set-Cookie` for the session;
        later polls return `delivered`. Over the per-source limit the response
        reads `pending` (no oracle). An unknown but well-formed `request_id` reads
        `pending` until the request lifetime would have ended, then `expired`,
        so a decoy poll cannot reveal that no mail was sent. Malformed or old
        ids, and expired requests, read `expired` at once.
      security: []
      parameters:
        - name: request_id
          in: path
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      responses:
        '200':
          description: Current state of the login request
          headers:
            Set-Cookie:
              description: Present only on the single `approved` response.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginState' }
              examples:
                pending: { externalValue: fixtures/login-pending.json }
                approved: { externalValue: fixtures/login-approved.json }
                delivered: { externalValue: fixtures/login-delivered.json }
                expired: { externalValue: fixtures/login-expired.json }

  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: Current user, capabilities, contract version and CSRF token
      responses:
        '200':
          description: Signed in
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              examples:
                deviceUser: { externalValue: fixtures/session-device-user.json }
                noDevices: { externalValue: fixtures/session-no-devices.json }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /logout:
    post:
      tags: [session]
      operationId: logout
      summary: Revoke the current session server-side
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Session revoked; cookie cleared
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Companions assigned to the caller
      description: In M1 a Backend may return an empty list and set `capabilities.devices` to `unavailable`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Assigned devices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
              examples:
                empty: { externalValue: fixtures/devices-empty.json }
                one: { externalValue: fixtures/devices-one.json }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /identities:
    get:
      tags: [messaging]
      operationId: listIdentities
      summary: (M2 draft) Messaging identities the caller may use
      responses:
        '200':
          description: Authorized identities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /conversations:
    get:
      tags: [messaging]
      operationId: listConversations
      summary: (M2 draft) Authorized conversation summaries
      description: |
        Cursors on this endpoint are stable history cursors and never expire;
        there is no 410 here. A merged enrolled pair is one conversation (see
        `Conversation`).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversation summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationList' }
              examples:
                mergedPair: { externalValue: fixtures/conversations-merged-pair.json }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /conversations/{conversation_id}:
    get:
      tags: [messaging]
      operationId: getConversation
      summary: (M2 draft) One authorized conversation
      description: |
        Returns the same shape as one item of `GET /conversations`. It is
        scope-checked: a conversation the caller cannot see answers 404, never
        403, so the endpoint is not an existence oracle. The Reader uses it for
        a deep link to a conversation that is not in the pages it has loaded.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OpaqueId' }
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
              examples:
                one: { externalValue: fixtures/conversation-one.json }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Not found or not visible to the caller, without disclosing existence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notVisible: { externalValue: fixtures/error-404-conversation.json }

  /conversations/{conversation_id}/read:
    post:
      tags: [messaging]
      operationId: markConversationRead
      summary: (M2 draft) Mark a conversation read up to a message
      description: |
        Idempotent. Marks the conversation read up to the message `up_to`. The
        Backend then emits a `conversation` event carrying the new
        `unread_count`. The Reader calls this when it opens a conversation
        whose `unread_count` is above 0; a failure is not fatal and is not
        retried in a loop. An `up_to` older than the current read mark is a
        successful no-op. An `up_to` that is not a message in this
        conversation is 422 `validation_failed`; 404 is reserved for a
        conversation the caller cannot see.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: conversation_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OpaqueId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadRequest' }
      responses:
        '204':
          description: Marked read
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found or not visible to the caller, without disclosing existence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: "`up_to` is not a message in this conversation (code `validation_failed`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /conversations/{conversation_id}/messages:
    get:
      tags: [messaging]
      operationId: listMessages
      summary: (M2 draft) Messages in one authorized conversation
      description: |
        History cursors are stable and never expire; there is no 410 here.
        Channel messages carry `identity_id: null` and only `sender_label` as
        sender information.
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OpaqueId' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageList' }
              examples:
                channelNullIdentity: { externalValue: fixtures/messages-channel-null-identity.json }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /contacts:
    get:
      tags: [messaging]
      operationId: listContacts
      summary: (M2 draft) Authorized contacts
      description: |
        **Draft, pending an owner scoping decision.** It is not yet settled
        whether this is a mesh-global directory (every signed-in user sees
        every heard node) or is scoped to the caller's fleet and assignments
        plus favourites. Neither is promised until the decision is recorded
        here. History cursors on this endpoint are stable and never expire.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Contacts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /channels:
    get:
      tags: [messaging]
      operationId: listChannels
      summary: (M2 draft) Public and private channels the caller may read
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /send-attempts:
    post:
      tags: [messaging]
      operationId: createSendAttempt
      summary: (M2 draft) Explicit Backend-path send
      description: |
        One logical attempt. The Backend chooses transmitting origins; the
        Reader never selects gateways. Same `Idempotency-Key` with the same
        body returns the existing attempt; with a different body returns 409.
        A BLE-path attempt is never posted here. Until the Backend ships
        multi-origin coordination it sends only through the caller's own
        assigned Companion (single origin), so `status_evidence.per_origin`
        is absent.

        **Which failures are definite.** Only a 4xx answer (400, 403, 404,
        409, 422, and 429 with `Retry-After`) is a definite "not accepted". Any
        5xx answer, 503 included, is always ambiguous: the attempt may or may
        not have been created. The Backend deduplicates on `client_attempt_id`,
        so re-POSTing the same attempt (same `Idempotency-Key`, same body)
        returns the existing attempt and never sends twice. A client never
        answers an ambiguous result by creating a new attempt.

        **First channel send.** The first send to a channel creates the
        conversation server-side. Creation is idempotent per channel, so
        concurrent first sends land in one conversation, and a `conversation`
        event follows.
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - name: Idempotency-Key
          in: header
          required: true
          description: Must equal `client_attempt_id`.
          schema: { $ref: '#/components/schemas/OpaqueId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendRequest' }
      responses:
        '201':
          description: Attempt created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAttempt' }
              examples:
                deviceUnknown: { externalValue: fixtures/send-attempt-device-unknown.json }
                unsupportedTransmitted: { externalValue: fixtures/send-attempt-unsupported-transmitted.json }
        '200':
          description: Idempotent repeat of an existing attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAttempt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/Throttled' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /send-attempts/{attempt_id}:
    get:
      tags: [messaging]
      operationId: getSendAttempt
      summary: (M2 draft) Send attempt and its evidenced state
      description: Never show `unknown` as failed; see `SendStatus`.
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema: { $ref: '#/components/schemas/OpaqueId' }
      responses:
        '200':
          description: Attempt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendAttempt' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: (M2 draft) Authorized incremental updates (SSE)
      description: |
        `text/event-stream`. Each `data:` line is one `EventEnvelope`. Resume
        with the standard `Last-Event-ID` header or the `cursor` query
        parameter; both are accepted, and the header wins when both are
        present. An expired or out-of-retention cursor yields HTTP 410 with
        code `cursor_expired` before the stream starts; there is no separate
        reset event kind. The Reader then reloads snapshots and reconnects
        without a cursor. Private content is never
        replayed after revocation.

        **Cursor expiry is per endpoint.** Only `/events` cursors expire (410
        `cursor_expired`). History cursors on `/conversations`, `/messages`,
        `/contacts` and `/devices` are stable and never expire.

        **Heartbeat.** While idle the Backend sends an SSE comment line
        (`: heartbeat`) at least every 25 seconds, so a client can tell an idle
        stream from a dead one. The Reader treats 2 missed intervals (no bytes
        for 50 s) as dead and reconnects with `Last-Event-ID`. A comment line
        counts as a heartbeat.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/EventEnvelope' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '410':
          description: Cursor expired or outside retention; reload snapshots
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                expired: { externalValue: fixtures/error-410-events.json }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mecon_session

  headers:
    NoStore:
      schema: { type: string, const: no-store }

  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: Value of `csrf_token` from `GET /session`.
      schema: { type: string, minLength: 16 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Unauthenticated:
      description: No valid session
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, examples: { e: { externalValue: fixtures/error-401.json } } } }
    Forbidden:
      description: Authenticated but not permitted (also a failed CSRF or Origin check)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, examples: { e: { externalValue: fixtures/error-403.json } } } }
    NotFound:
      description: Unavailable or not found, without disclosing existence
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Idempotency key reused with a different request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Gone:
      description: Cursor expired or outside retention
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Invalid:
      description: Request failed validation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Throttled:
      description: Rate limited
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: Temporarily unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque; clients never parse or construct it.
    Timestamp:
      type: string
      format: date-time
      description: UTC, ISO-8601, with `Z`.

    Error:
      type: object
      required: [code, message, request_id, retryable]
      additionalProperties: false
      properties:
        code: { type: string, examples: [unauthenticated, forbidden, csrf_failed, origin_rejected, not_found, conflict, invalid, throttled, unavailable, cursor_expired] }
        message: { type: string }
        request_id: { type: string }
        retryable: { type: boolean }

    Health:
      type: object
      required: [status, commit]
      properties:
        status: { type: string, enum: [ok, degraded] }
        commit:
          type: [string, 'null']
          description: Deployed commit, or null for a local build.

    LoginRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginStarted:
      type: object
      required: [request_id, poll_after_ms, expires_at]
      properties:
        request_id: { type: string }
        poll_after_ms: { type: integer, minimum: 500 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }

    LoginState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [pending, approved, delivered, expired] }
        poll_after_ms: { type: integer, minimum: 500 }

    CapabilityState:
      type: string
      enum: [available, unavailable, forbidden]
      description: |
        `available`: the Backend serves it for this user. `unavailable`: not
        implemented or not reachable on this Backend. `forbidden`: exists but
        this user lacks the grant. The Reader shows each truthfully and never
        simulates an unavailable function.

    Session:
      type: object
      required: [user, capabilities, contract_version, csrf_token, expires_at]
      properties:
        user:
          type: object
          required: [id, display_name]
          properties:
            id: { $ref: '#/components/schemas/OpaqueId' }
            display_name: { type: string }
        capabilities:
          type: object
          required: [devices, messaging, send, events, observations]
          additionalProperties: { $ref: '#/components/schemas/CapabilityState' }
          properties:
            devices: { $ref: '#/components/schemas/CapabilityState' }
            messaging: { $ref: '#/components/schemas/CapabilityState' }
            send: { $ref: '#/components/schemas/CapabilityState' }
            events: { $ref: '#/components/schemas/CapabilityState' }
            observations: { $ref: '#/components/schemas/CapabilityState' }
        contract_version:
          type: string
          pattern: '^1\.[0-9]+$'
          description: Major is fixed by the URL prefix; minor advertises additions.
        csrf_token: { type: string, minLength: 16 }
        expires_at: { $ref: '#/components/schemas/Timestamp' }

    ListMeta:
      type: object
      required: [next_cursor, as_of]
      properties:
        next_cursor: { type: [string, 'null'] }
        as_of: { $ref: '#/components/schemas/Timestamp' }

    Device:
      type: object
      required: [id, role, label, capability_evidence, reachability, observed_at]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        role: { type: string, enum: [companion, repeater, room_server, unknown] }
        label: { type: string }
        capability_evidence:
          type: object
          description: From the device's own reported capabilities, never inferred from board model.
          additionalProperties: { type: boolean }
        battery_pct: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        reachability: { type: string, enum: [online, stale, offline, unknown] }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
    DeviceList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Device' } }

    Identity:
      type: object
      required: [id, display_name, public_key_prefix, device_id, can_send]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        display_name: { type: string }
        public_key_prefix: { type: string, pattern: '^[0-9a-f]{2,16}$' }
        device_id: { type: [string, 'null'] }
        can_send: { type: boolean }
    IdentityList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Identity' } }

    Target:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [contact, channel] }
        id: { $ref: '#/components/schemas/OpaqueId' }

    Conversation:
      description: |
        `id` is derived server-side and is opaque: clients never parse or
        construct it, and it may change only through a resync. When the same
        peer is reachable through an enrolled pair of identities that the
        Backend has merged, the pair is exposed as one conversation (one
        `id`, one entry in lists), not two.
      type: object
      required: [id, identity_id, target, title, unread_count, last_activity_at]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        identity_id: { $ref: '#/components/schemas/OpaqueId' }
        target: { $ref: '#/components/schemas/Target' }
        title: { type: string }
        unread_count:
          type: integer
          minimum: 0
          description: |
            Changes when the Backend marks messages read, which a client
            requests with `POST /conversations/{conversation_id}/read`. A
            `conversation` event carries the new count.
        last_activity_at: { $ref: '#/components/schemas/Timestamp' }
    ConversationList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Conversation' } }

    Message:
      type: object
      required: [message_id, conversation_id, identity_id, direction, source_path, observed_at, content]
      properties:
        message_id: { $ref: '#/components/schemas/OpaqueId' }
        conversation_id: { $ref: '#/components/schemas/OpaqueId' }
        identity_id:
          description: |
            Required (non-null) for the caller's own direct messages. Null on
            channel traffic, where `sender_label` is the only sender
            information.
          oneOf:
            - $ref: '#/components/schemas/OpaqueId'
            - type: 'null'
        direction: { type: string, enum: [inbound, outbound] }
        sender_label: { type: [string, 'null'] }
        source_path: { type: string, enum: [backend, ble, unknown] }
        observed_at: { $ref: '#/components/schemas/Timestamp' }
        content:
          type: object
          required: [kind, text]
          properties:
            kind: { type: string, enum: [text] }
            text: { type: string }
        attempt_id: { type: [string, 'null'] }
    MessageList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Message' } }

    Contact:
      type: object
      required: [id, display_name, public_key_prefix, last_heard_at]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        display_name: { type: string }
        public_key_prefix: { type: string, pattern: '^[0-9a-f]{2,16}$' }
        kind: { type: string, enum: [companion, repeater, room_server, unknown] }
        favourite: { type: boolean }
        last_heard_at: { type: [string, 'null'], format: date-time }
    ContactList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Contact' } }

    Channel:
      type: object
      required: [id, name, visibility]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string }
        visibility: { type: string, enum: [public, private] }
        favourite: { type: boolean }
    ChannelList:
      allOf:
        - $ref: '#/components/schemas/ListMeta'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Channel' } }

    SendRequest:
      type: object
      required: [client_draft_id, client_attempt_id, identity_id, target, content]
      additionalProperties: false
      properties:
        client_draft_id: { $ref: '#/components/schemas/OpaqueId' }
        client_attempt_id: { $ref: '#/components/schemas/OpaqueId' }
        identity_id: { $ref: '#/components/schemas/OpaqueId' }
        target: { $ref: '#/components/schemas/Target' }
        content:
          type: object
          required: [kind, text]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [text] }
            text: { type: string, minLength: 1 }

    SendStatus:
      type: string
      enum: [queued, duty_held, transmitted, acked, timed_out, failed, unknown]
      description: |
        `acked` exists only for direct messages (native ACK; not a read
        receipt). It never appears for a channel target: channel sends have no
        per-recipient ack, and the Backend never emits it there. A client that
        nevertheless receives `acked` on a channel attempt treats it as
        `transmitted`.

        A failed `POST /send-attempts` is definitely not accepted only on a
        4xx answer. A 5xx answer, 503 included, is ambiguous; the Reader
        re-POSTs the same attempt and never creates a new one. `unknown` and `timed_out` do not prove non-transmission; the
        Reader never resends automatically.

        `unknown` and `timed_out` are reported only when the device itself
        reports them (`status_evidence.source: device`, public-firmware
        Companions). Legacy gateways (`source: unsupported`) map only to
        `queued`, `transmitted`, `acked` or `failed`. The Reader must never
        show `unknown` as failed.

    SendAttempt:
      description: |
        For a channel target `status` is never `acked` (see `SendStatus`); a
        client that receives it anyway shows the attempt as transmitted.
      type: object
      required: [id, client_attempt_id, path, identity_id, status, status_evidence, created_at, updated_at]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        client_attempt_id: { $ref: '#/components/schemas/OpaqueId' }
        path: { type: string, const: backend }
        identity_id: { $ref: '#/components/schemas/OpaqueId' }
        status: { $ref: '#/components/schemas/SendStatus' }
        status_evidence:
          type: object
          required: [accepted_at, source]
          description: What the Backend has actually seen. No gateway identities or fleet topology.
          properties:
            accepted_at: { $ref: '#/components/schemas/Timestamp' }
            first_transmitted_at: { type: [string, 'null'], format: date-time }
            transmissions: { type: integer, minimum: 0 }
            acked_at: { type: [string, 'null'], format: date-time }
            detail: { type: [string, 'null'] }
            source:
              type: string
              enum: [device, unsupported]
              description: |
                `device`: the status was reported by the transmitting device
                itself. `unsupported`: the origin cannot report device-level
                status (legacy gateway); only queued, transmitted, acked or
                failed can occur.
            per_origin:
              type: array
              description: |
                Optional, absent until the Backend's multi-origin coordination
                ships. Until then the Backend sends only through the caller's
                own assigned Companion and the top-level fields describe that
                single origin. Items never expose gateway identities.
              items:
                type: object
                required: [origin_ordinal, status, transmitted_at]
                additionalProperties: false
                properties:
                  origin_ordinal: { type: integer, minimum: 0, description: 'Position within this attempt only; not a gateway identifier.' }
                  status: { $ref: '#/components/schemas/SendStatus' }
                  transmitted_at: { type: [string, 'null'], format: date-time }
        created_at: { $ref: '#/components/schemas/Timestamp' }
        updated_at: { $ref: '#/components/schemas/Timestamp' }

    ReadRequest:
      type: object
      required: [up_to]
      additionalProperties: false
      properties:
        up_to:
          allOf:
            - $ref: '#/components/schemas/OpaqueId'
          description: The `message_id` of the newest message the user has seen.

    EventEnvelope:
      description: |
        `resource_id` by `kind`: the conversation id for `message` and
        `conversation`; the server attempt `id` for `attempt_status`; the
        device id for `device_status`, which a client may ignore. A client may
        refetch its open attempts when it meets an unknown id.
      type: object
      required: [event_id, kind, occurred_at, version]
      properties:
        event_id: { type: string }
        kind:
          type: string
          enum: [message, conversation, device_status, attempt_status, authorization_changed, resync_required]
        occurred_at: { $ref: '#/components/schemas/Timestamp' }
        resource_id: { type: [string, 'null'] }
        version: { type: integer, minimum: 1 }
