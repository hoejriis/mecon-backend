name: capture
on:
  pull_request:
    paths: ['capture/**', 'contracts/raw-capture/**', 'contracts/observation-subscription/**', '.github/workflows/capture.yml']
  push:
    branches: [main, 'capture/**']
    paths: ['capture/**', 'contracts/raw-capture/**', 'contracts/observation-subscription/**', '.github/workflows/capture.yml']
permissions:
  contents: read
concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: capture/requirements-dev.lock
      - name: Install dependencies (hash-pinned)
        run: pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Install mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mosquitto
          # The default broker service is not wanted; the tests start their own on free ports.
          sudo systemctl disable --now mosquitto || true
          # On the hosted image the mosquitto AppArmor profile confines /usr/sbin/mosquitto to
          # system paths, so a config under /tmp makes it exit at once. Unload it for this job.
          sudo apparmor_parser -R /etc/apparmor.d/mosquitto || true
          command -v mosquitto && mosquitto -h | head -1
      - name: Contract fixtures, unit and integration tests
        run: python -m pytest -q -ra --junitxml=pytest.xml
      - name: Mutation check (receive-only, capture and buffer rules)
        run: python scripts/mutation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-pytest
          path: capture/pytest.xml
          if-no-files-found: ignore
